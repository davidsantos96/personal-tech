<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8800"/>
      <stop offset="100%" stop-color="#ff3300"/>
    </linearGradient>
    <linearGradient id="grad-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8800" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ff3300" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Hex outer -->
  <polygon points="32,2.2 57.6,17.1 57.6,46.9 32,61.8 6.4,46.9 6.4,17.1" fill="#111111"/>
  <polygon points="32,2.2 57.6,17.1 57.6,46.9 32,61.8 6.4,46.9 6.4,17.1" fill="url(#grad-fill)"/>
  <polygon points="32,2.2 57.6,17.1 57.6,46.9 32,61.8 6.4,46.9 6.4,17.1" fill="none" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Hex inner subtle -->
  <polygon points="32,9.9 50.5,20.5 50.5,43.5 32,54.1 13.5,43.5 13.5,20.5" fill="none" stroke="url(#grad)" stroke-width="1" stroke-opacity="0.12"/>

  <!-- Bar -->
  <rect x="15.5" y="33.2" width="33" height="3.6" rx="1.8" fill="url(#grad)" filter="url(#glow)"/>

  <!-- Left weight block -->
  <rect x="8" y="24.5" width="7.5" height="18" rx="2.5" fill="url(#grad)" opacity="0.88"/>
  <!-- Left weight inner plate -->
  <rect x="10" y="23.2" width="3.8" height="20.6" rx="1.6" fill="url(#grad)"/>

  <!-- Right weight block -->
  <rect x="48.5" y="24.5" width="7.5" height="18" rx="2.5" fill="url(#grad)" opacity="0.88"/>
  <!-- Right weight inner plate -->
  <rect x="50.2" y="23.2" width="3.8" height="20.6" rx="1.6" fill="url(#grad)"/>
</svg>
